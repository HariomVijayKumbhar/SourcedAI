services:
  - type: web
    name: sourceai-backend
    runtime: python
    plan: free
    build:
      commands:
        - pip install -r requirements.txt
    start:
      command: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: JWT_SECRET
        generateValue: true
      # Set these via the Render dashboard Environment tab after first deploy:
      # - OPENAI_API_KEY (or ANTHROPIC_API_KEY if LLM_PROVIDER=anthropic)
      # - ALLOWED_ORIGIN (set to your Vercel frontend URL, e.g. https://your-app.vercel.app)
    autoDeploy: true
