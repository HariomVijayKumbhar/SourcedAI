services:
  - type: web
    name: sourceai-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_MODEL
        value: openai/gpt-4o-mini
      - key: MAX_TOKENS
        value: "1000"
      - key: TEMPERATURE
        value: "0.2"
      - key: ALLOWED_ORIGIN
        value: https://sourceai.vercel.app
      - key: MAX_FILE_SIZE_MB
        value: "10"
      # Secrets — set these in the Render dashboard Environment tab after first deploy:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHROMA_PERSIST_DIR
        value: ""
      - key: DATABASE_PATH
        value: ""
    autoDeploy: true